name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name'
        required: true

permissions:
  contents: write

jobs:
  build-vscode-extension:
    name: Build VS Code Extension (.vsix)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies and compile
        run: |
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
          npm ci
          npm test

      - name: Package VSIX
        run: |
          mkdir -p release
          npx @vscode/vsce package --no-dependencies -o "release/moonclicker-script-workbench-${{ steps.version.outputs.version }}.vsix"

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: moonclicker-vscode-extension
          path: release/*.vsix
          retention-days: 7

  publish:
    name: Publish to Open VSX
    needs: [build-vscode-extension]
    runs-on: ubuntu-latest
    # 只上 Open VSX；沒設 token 時略過，GitHub release 照常建立。
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}

    steps:
      - name: Download VSIX Artifact
        uses: actions/download-artifact@v4
        with:
          name: moonclicker-vscode-extension
          path: release-assets

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx publish release-assets/*.vsix

  create-release:
    name: Create Release
    needs: [build-vscode-extension]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Download VSIX Artifact
        uses: actions/download-artifact@v4
        with:
          name: moonclicker-vscode-extension
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
