name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the v prefix, e.g. 0.6.0. The tag is created on the dispatched commit.'
        required: true

permissions:
  contents: write

jobs:
  build-vscode-extension:
    name: Build VS Code Extension (.vsix)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Marketplace 與 Open VSX 上架後同一版本不能重發，所以在 build 前擋掉格式錯誤、非 master 與重複的版本。
      - name: Determine Version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.ref }}" != "refs/heads/master" ]; then
              echo "::error::Manual releases must be dispatched from master"
              exit 1
            fi
            VERSION="$INPUT_VERSION"
            if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
              echo "::error::Tag v${VERSION} already exists"
              exit 1
            fi
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '${VERSION}' is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies and compile
        run: |
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
          npm ci
          npm test

      - name: Package VSIX
        run: |
          mkdir -p release
          npx @vscode/vsce package --no-dependencies -o "release/moonclicker-script-workbench-${{ steps.version.outputs.version }}.vsix"

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: moonclicker-vscode-extension
          path: release/*.vsix
          retention-days: 7

  publish:
    name: Publish to Open VSX
    needs: [build-vscode-extension]
    runs-on: ubuntu-latest
    # 沒設 token 時略過，GitHub release 照常建立。
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}

    steps:
      - name: Download VSIX Artifact
        uses: actions/download-artifact@v4
        with:
          name: moonclicker-vscode-extension
          path: release-assets

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx publish release-assets/*.vsix

  publish-vscode-marketplace:
    name: Publish to VS Code Marketplace
    needs: [build-vscode-extension]
    # 以 Entra ID managed identity 經 OIDC 登入，不存 PAT；沒設 AZURE_CLIENT_ID 時略過。
    # 判斷放在 step：job 層的 if 讀不到 environment 的 variable。
    runs-on: ubuntu-latest
    environment: marketplace-publish
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download VSIX Artifact
        if: vars.AZURE_CLIENT_ID != ''
        uses: actions/download-artifact@v4
        with:
          name: moonclicker-vscode-extension
          path: release-assets

      - name: Set up Node.js
        if: vars.AZURE_CLIENT_ID != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Azure login
        if: vars.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish
        if: vars.AZURE_CLIENT_ID != ''
        run: npx --yes @vscode/vsce publish --azure-credential --skip-duplicate --packagePath release-assets/*.vsix

  create-release:
    name: Create Release
    needs: [build-vscode-extension]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 以 GITHUB_TOKEN 推送的 tag 不會再觸發本 workflow，不會重複 build
      - name: Create Tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag "${{ needs.build-vscode-extension.outputs.tag }}" "$GITHUB_SHA"
          git push origin "${{ needs.build-vscode-extension.outputs.tag }}"

      - name: Download VSIX Artifact
        uses: actions/download-artifact@v4
        with:
          name: moonclicker-vscode-extension
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-vscode-extension.outputs.tag }}
          name: ${{ needs.build-vscode-extension.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
